<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stella Sora model viewer</title>
<style>
  :root { font: 15px/1.5 system-ui, sans-serif; color: #202122; background: #f8f9fa; }
  body { margin: 20px auto; padding: 0 16px; max-width: 1100px; }
  h1 { font-size: 24px; }
  select, button { font: inherit; padding: 5px 8px; max-width: 100%; }
  button { cursor: pointer; }
  .model-viewer-control { max-width: 100%; }
  .model-viewer-control-model { flex: 1; }
  .model-viewer-control-model .model-viewer-select { width: 100%; max-width: none; }
  .model-viewer-control button { display: inline-flex; align-items: center; }
  #status { color: #b32424; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Stella Sora model viewer</h1>
<p>Variants include their base model’s animations. Reload after exporting to fetch fresh local files.</p>
<p id="status" role="status">Loading…</p>
<div class="model-viewer" id="viewer" data-height="min(65vh, 650px)"
     data-preload="eager" data-shading="unlit" data-background="#f8f9fa"
     data-hide-parts="optional" data-outline="1" data-outline-width="25" data-anim-default="Run">
  <div class="model-viewer-controls" data-controls="model,anim"></div>
  <div class="model-viewer-controls" data-controls="play,scrub,speed,loop,reset,fullscreen"></div>
</div>
<script type="module">
const GADGET = 'https://cdn.jsdelivr.net/gh/lihaohong6/MirahezeDevScripts@dist/dist/ModelViewer/gadget-impl.js';
const ASSETS = new URL('../assets/assetbundles/actor3d/', location.href);
const revision = Date.now().toString();
const status = document.getElementById('status');
const viewer = document.getElementById('viewer');

const hooks = new Map();
window.mediaWiki = window.mw = {
  hook(name) {
    if (!hooks.has(name)) {
      const callbacks = new Set();
      let previous;
      const hook = {
        add(callback) {
          callbacks.add(callback);
          if (previous) callback(...previous);
          return hook;
        },
        remove(callback) { callbacks.delete(callback); return hook; },
        fire(...args) {
          previous = args;
          for (const callback of callbacks) callback(...args);
          return hook;
        },
      };
      hooks.set(name, hook);
    }
    return hooks.get(name);
  },
  log: Object.assign(console.log.bind(console), {
    warn: console.warn.bind(console), error: console.error.bind(console),
  }),
  loader: {
    using() { return Promise.resolve(); },
    impl(factory) {
      const [, script, styles] = factory();
      for (const css of styles?.css || []) {
        const style = document.createElement('style');
        style.textContent = css;
        document.head.append(style);
      }
      script();
    },
  },
};

function localUrl(path) {
  const url = new URL(path, ASSETS);
  url.searchParams.set('v', revision);
  return url.href;
}

async function readJson(path, optional = false) {
  const response = await fetch(localUrl(path), { cache: 'no-store' });
  if (optional && response.status === 404) return { clips: [] };
  if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
  return response.json();
}

function loadGadget() {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = GADGET;
    script.onload = () => hooks.has('wikipage.content')
      ? resolve() : reject(new Error('The gadget did not register its page hook.'));
    script.onerror = () => reject(new Error('Could not load ModelViewer from jsDelivr. Check your network connection.'));
    document.head.append(script);
  });
}

try {
  if (location.protocol === 'file:') throw new Error('Serve the repository root with python3 -m http.server 8777, then open http://localhost:8777/tools/model_viewer.html.');
  const [models] = await Promise.all([readJson('index.json'), loadGadget()]);
  if (!models.length) throw new Error('No local models found. Run uv run -m unpack.unpack_model first.');
  const manifests = await Promise.all(models.map(model => readJson(model.file.replace(/\.glb$/, '.anims.json'), true)));
  const modelAnimations = {};
  for (const [index, model] of models.entries()) {
    const character = model.label.split(': ')[0];
    const baseIndex = models.findIndex(entry => entry.label === character);
    const baseClips = baseIndex >= 0 && baseIndex !== index ? manifests[baseIndex].clips : [];
    const baseNames = new Set(baseClips.map(clip => clip.name));
    const baseFiles = new Set(baseClips.map(clip => clip.file));
    const ownClips = manifests[index].clips.filter(clip => !baseFiles.has(clip.file)).map(clip => ({
      ...clip, name: baseNames.has(clip.name) ? `${clip.name} (variant)` : clip.name,
    }));
    modelAnimations[index] = [...baseClips, ...ownClips]
      .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
      .map(clip => ({ name: clip.name, src: localUrl(clip.file), show: clip.show, hide: clip.hide }));
  }
  viewer.dataset.models = JSON.stringify(models.map(model => ({ name: model.label, src: localUrl(model.file) })));
  viewer.dataset.modelAnim = JSON.stringify(modelAnimations);
  status.hidden = true;
  mw.hook('wikipage.content').fire(document.body);
} catch (error) {
  status.textContent = error.message;
  console.error(error);
}
</script>
</body>
</html>
